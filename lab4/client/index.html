<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../client/css/style.css">
    <title>Letters Management</title>
</head>
<body>
    <h1>Letters Management</h1>
    <form id="addLetterForm">
        <input type="text" id="sender" placeholder="Sender">
        <input type="text" id="recipient" placeholder="Recipient">
        <input type="date" id="date">
        <label>
            <input type="checkbox" id="isRegistered"> Registered
        </label>
        <button type="submit">Add Letter</button>
    </form>
    <div id="lettersList"></div>
    <script src="../client/js/main.js"></script>
</body>
</html>
